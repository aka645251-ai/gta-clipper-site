<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>gta-clipper</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0D10;--s:#12151A;--s2:#181C22;--ln:#222831;--tx:#ECEFF3;--mu:#98A2B0;--a:#4BE3A0;--ink:#04150D;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
header{display:flex;align-items:center;gap:16px;padding:18px 32px;border-bottom:1px solid var(--ln)}
.logo{font-weight:700;font-size:17px;letter-spacing:-.2px;flex:1}.logo b{color:var(--a)}
.av{width:36px;height:36px;border-radius:50%;background:var(--s2);border:1px solid var(--ln);display:grid;place-items:center;font-weight:600;font-size:13px}
main{max-width:1040px;margin:0 auto;padding:0 24px}
button,input,select{font:inherit;color:inherit}
input,select{background:var(--s);border:1px solid var(--ln);border-radius:12px;padding:0 16px;min-height:52px;width:100%}
input::placeholder{color:#6F7A89}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.btn{min-height:52px;padding:0 24px;border-radius:12px;border:1px solid var(--ln);background:var(--s2);font-weight:600;cursor:pointer}
.btn:hover{background:#1F242C}
.btn.pri{background:var(--a);border-color:var(--a);color:var(--ink)}.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
label{display:block;font-size:12px;font-weight:500;color:var(--mu);margin-bottom:6px}
/* start */
.hero{padding:96px 0 40px;text-align:center}
.hero h1{margin:0 auto;max-width:760px;font-size:clamp(34px,6vw,60px);line-height:1.05;letter-spacing:-1.6px;font-weight:800}
.hero p{margin:18px auto 0;max-width:520px;color:var(--mu);font-size:17px}
.box{max-width:760px;margin:40px auto 0;display:flex;gap:10px}
.box input{flex:1;min-height:60px;font-size:16px}.box .btn{min-height:60px;white-space:nowrap}
.err{color:#FF9B9B;font-size:14px;min-height:22px;margin:10px auto 0;max-width:760px;text-align:left}
details{max-width:760px;margin:6px auto 0;text-align:left}
summary{cursor:pointer;color:var(--mu);font-size:14px;padding:10px 0;width:max-content}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:8px 0 4px}
.note{color:#7A8594;font-size:13px;text-align:center;margin-top:28px}
/* run */
.run{max-width:640px;margin:96px auto 0}
.run h2{margin:0 0 6px;font-size:26px;letter-spacing:-.5px}
.src{color:var(--mu);font-size:14px;word-break:break-all}
.bar{height:6px;background:var(--ln);border-radius:3px;margin:26px 0 22px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--a);transition:width .6s}
.st{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.st li{display:flex;align-items:center;gap:12px;padding:10px 0;color:#6F7A89}
.st li::before{content:"";width:18px;height:18px;border-radius:50%;border:2px solid #333B46;flex:none}
.st li.act{color:var(--tx);font-weight:600}.st li.act::before{border-color:var(--a);border-top-color:transparent;animation:sp 1s linear infinite}
.st li.ok{color:var(--mu)}.st li.ok::before{background:var(--a);border-color:var(--a)}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.st li.act::before{animation:none}.bar i{transition:none}}
/* results */
.rh{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:48px 0 22px}
.rh h2{margin:0;font-size:32px;letter-spacing:-.8px;line-height:1.1}.rh p{margin:6px 0 0;color:var(--mu);font-size:14px;word-break:break-all}
.rh>div{flex:1;min-width:240px}
.tag{display:inline-block;font-size:11px;font-weight:600;color:#F2C14E;border:1px solid #4A3F1E;border-radius:6px;padding:1px 8px;margin-left:8px;vertical-align:middle}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(224px,1fr));gap:18px;padding-bottom:150px}
.clip{background:var(--s);border:1px solid var(--ln);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.clip.sel{border-color:var(--a);box-shadow:0 0 0 1px var(--a)}
.th{position:relative;aspect-ratio:9/13;background:#0A0C0F;display:flex;flex-direction:column}
.th .f{flex:0 0 34%;background:#1D242E;display:grid;place-items:center;font-size:12px;color:#8A95A4}
.th .g{flex:1;background:#141920;display:grid;place-items:center;font-size:12px;color:#707B8A}
.th .c{position:absolute;left:12px;right:12px;bottom:16px;text-align:center;font-weight:800;font-size:18px;text-shadow:0 2px 8px #000}
.pill{position:absolute;top:10px;background:#000C;border-radius:8px;padding:2px 9px;font-size:12px;font-weight:700}
.pill.r{left:10px}.pill.d{right:10px}
.ck{position:absolute;left:10px;bottom:70px;width:26px;height:26px;accent-color:var(--a);min-height:0;padding:0}
.mt{padding:14px;display:grid;gap:8px}
.mt h3{margin:0;font-size:15px;line-height:1.35}
.sc{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mu)}
.sc b{background:var(--a);color:var(--ink);border-radius:6px;padding:1px 8px}.sc b.m{background:#F2C14E}.sc b.l{background:#B7C0CC}
.hs{color:#8CC4FF;font-size:12px;margin:0}
.bt{display:flex;gap:8px}.bt .btn{flex:1;min-height:40px;padding:0 10px;font-size:14px}
.dock{position:fixed;left:0;right:0;bottom:0;background:#0E1116F2;border-top:1px solid var(--ln);padding:14px 24px}
.dk{max-width:1040px;margin:0 auto;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.dk>div{min-width:150px;flex:1}.dk .n{flex:0 0 auto;font-weight:600;padding-bottom:14px}
.msg{max-width:1040px;margin:10px auto 0;font-size:14px;color:var(--a);min-height:20px}
@media (max-width:720px){header{padding:14px 18px}.hero{padding-top:56px}.box{flex-direction:column}.opts{grid-template-columns:1fr 1fr}.dock{padding:12px 16px}}
</style>
</head>
<body>
<header><div class="logo">gta<b>-</b>clipper</div><div class="av" aria-label="Account">A</div></header>
<main>

<section id="v-start" class="view">
<div class="hero">
<h1>Turn any stream into ready-to-post clips.</h1>
<p>Paste a YouTube link. The best moments are found, cut, captioned and ready to schedule.</p>
<form class="box" id="f" novalidate>
<label for="url" style="position:absolute;left:-9999px">YouTube link</label>
<input id="url" type="url" inputmode="url" autocomplete="off" placeholder="https://www.youtube.com/watch?v=...">
<button class="btn pri" type="submit">Start clipping</button>
</form>
<div class="err" id="err" role="alert"></div>
<details><summary>Options</summary>
<div class="opts">
<div><label for="o1">Start from</label><input id="o1" value="00:00:00"></div>
<div><label for="o2">Clip length</label><select id="o2"><option>30-40 seconds</option><option>40-60 seconds</option></select></div>
<div><label for="o3">Clips</label><input id="o3" type="number" min="1" max="10" value="6"></div>
<div><label for="o4">Mode</label><select id="o4"><option>Auto: top moments</option><option>Manual time range</option></select></div>
</div></details>
<p class="note">Works with ended, public streams. Long streams are processed one section at a time.</p>
</div>
</section>

<section id="v-run" class="view" hidden>
<div class="run">
<h2>Working on your clips</h2>
<div class="src" id="src"></div>
<div class="bar" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="pb"></i></div>
<ul class="st" id="steps" aria-live="polite"></ul>
</div>
</section>

<section id="v-res" class="view" hidden>
<div class="rh">
<div><h2 id="rt">6 clips ready</h2><p id="rs"></p></div>
<button class="btn sm" id="all" type="button">Select all</button>
<button class="btn sm" id="again" type="button">New link</button>
</div>
<div class="grid" id="grid"></div>
<div class="dock" id="dock" hidden>
<div class="dk">
<div class="n" id="cnt"></div>
<div><label for="ch">Channel</label><select id="ch"><option>Main channel</option><option>Second channel</option></select></div>
<div><label for="t0">First publish</label><input id="t0" type="datetime-local"></div>
<div><label for="gap">Gap between clips</label><select id="gap"><option value="1">1 hour</option><option value="2" selected>2 hours</option><option value="4">4 hours</option><option value="24">1 day</option></select></div>
<button class="btn pri" id="sch" type="button">Schedule uploads</button>
</div>
<div class="msg" id="msg" role="status"></div>
</div>
</section>

</main>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
var DEMO=[
["He did NOT expect that landing","No way that worked","0:34",9.4,"#gta6 #insane #shorts"],
["Police chase goes completely wrong","Oh no no no","0:38",9.1,"#gta6 #chase #funny"],
["The stream chat lost it here","Chat is going crazy","0:31",8.7,"#gta6 #clutch #gaming"],
["Best heist moment so far","We are so cooked","0:40",8.2,"#gta6 #heist #viral"],
["Nobody saw this coming","Wait what is that","0:36",7.6,"#gta6 #plot #shorts"],
["Funniest crash of the night","That was so close","0:33",6.9,"#gta6 #crash #lol"]];
var STEPS=["Reading captions","Finding the top moments","Cutting the clips","Adding captions and layout","Ready"];
var sel={},timer=null;
function view(id){var v=document.querySelectorAll(".view");for(var i=0;i<v.length;i++)v[i].hidden=v[i].id!==id;window.scrollTo(0,0)}
function okUrl(u){try{var h=new URL(u).hostname;return["youtube.com","www.youtube.com","m.youtube.com","youtu.be"].indexOf(h)>-1}catch(e){return false}}
$("#f").addEventListener("submit",function(e){
e.preventDefault();var u=$("#url").value.trim();
if(!okUrl(u)){$("#err").textContent="Paste a full YouTube link, like https://www.youtube.com/watch?v=...";$("#url").focus();return}
$("#err").textContent="";$("#src").textContent=u;$("#rs").textContent=u;run()});
function run(){
view("v-run");var i=0;
function paint(){
var h="";for(var k=0;k<STEPS.length;k++){h+='<li class="'+(k<i?"ok":k===i?"act":"")+'">'+STEPS[k]+'</li>'}
$("#steps").innerHTML=h;
var p=Math.round(i/(STEPS.length-1)*100);$("#pb").style.width=p+"%";$(".bar").setAttribute("aria-valuenow",p)}
paint();clearInterval(timer);
timer=setInterval(function(){i++;paint();if(i>=STEPS.length-1){clearInterval(timer);setTimeout(results,600)}},1500)}
function results(){
sel={};var h="";
for(var n=0;n<DEMO.length;n++){var d=DEMO[n],c=d[3]>=8.5?"":d[3]>=7?"m":"l";
h+='<article class="clip" id="c'+n+'"><div class="th"><div class="f">Facecam</div><div class="g">Gameplay</div><div class="c">'+d[1]+'</div><span class="pill r">#'+(n+1)+'</span><span class="pill d">'+d[2]+'</span><input class="ck" type="checkbox" data-i="'+n+'" aria-label="Select clip '+(n+1)+'"></div><div class="mt"><div class="sc"><b class="'+c+'">'+d[3].toFixed(1)+'</b>Virality score</div><h3>'+d[0]+'</h3><p class="hs">'+d[4]+'</p><div class="bt"><button class="btn" type="button">Edit</button><button class="btn" type="button" aria-label="Download clip '+(n+1)+'">Download</button></div></div></article>'}
$("#grid").innerHTML=h;$("#rt").innerHTML=DEMO.length+' clips ready<span class="tag">Demo data</span>';
dock();view("v-res")}
function dock(){
var ids=Object.keys(sel).filter(function(k){return sel[k]}),n=ids.length;
$("#dock").hidden=n===0;$("#cnt").textContent=n+" selected";
for(var i=0;i<DEMO.length;i++){var el=$("#c"+i);if(el)el.classList.toggle("sel",!!sel[i])}
$("#msg").textContent=""}
$("#grid").addEventListener("change",function(e){var t=e.target;if(t.classList.contains("ck")){sel[t.getAttribute("data-i")]=t.checked;dock()}});
$("#all").addEventListener("click",function(){var boxes=document.querySelectorAll(".ck"),all=Object.keys(sel).filter(function(k){return sel[k]}).length===boxes.length;
for(var i=0;i<boxes.length;i++){boxes[i].checked=!all;sel[i]=!all}dock()});
$("#again").addEventListener("click",function(){clearInterval(timer);$("#url").value="";view("v-start")});
$("#sch").addEventListener("click",function(){
var ids=Object.keys(sel).filter(function(k){return sel[k]}).map(Number).sort(),v=$("#t0").value;
if(!v){$("#msg").textContent="Pick the first publish time.";$("#t0").focus();return}
var t=new Date(v).getTime(),g=Number($("#gap").value)*3600000,f=new Intl.DateTimeFormat(undefined,{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});
var out=ids.map(function(id,k){return f.format(new Date(t+k*g))});
$("#msg").textContent="Demo: "+ids.length+" clips would be scheduled on "+$("#ch").value+" at "+out.join(", ")+"."});
})();
</script>
</body>
</html>
